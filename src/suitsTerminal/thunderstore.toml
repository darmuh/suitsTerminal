[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "darmuh"
name = "suitsTerminal"
description = "(V73) An alternative solution to having too many suits crowding the suits rack! Remove all suits from the rack and allow them to be selected via the terminal. Rack modification is configurable and should be compatible with most other mods"
websiteUrl = "https://github.com/darmuh/suitsTerminal" # TODO: Add a link to your mod repository here (optional)
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2304"
darmuh-OpenLib = "0.4.1"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/suitsTerminal/release/com.github.darmuh.suitsTerminal.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE.MD"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
# replace _ThunderstoreGameIdentifier_ with community name in this file
communities = [ "lethal-company", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/_ThunderstoreGameIdentifier_/category/
lethal-company = [ "mods", "bepinex", "clientside", "suits", "cosmetics", ]
